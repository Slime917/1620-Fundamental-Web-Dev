<!doctype html>
<meta charset="utf-8">
<title>Generic Families Demo</title>
<style>
  body { margin: 2rem; font-size: 18px; line-height: 1.55; }
  .serif      { font-family: Georgia, "Times New Roman", serif; }
  .sans       { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono       { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
  .cursive    { font-family: "Brush Script MT", cursive; }
  .fantasy    { font-family: Impact, fantasy; }
</style>

<body class="mono">
  <h1>CSS Generic Families</h1>
  <p>The quick brown fox jumps over the lazy dog. 0123456789</p>
  <p>Switch the class on <code>&lt;body&gt;</code> to: <b>serif, sans, mono, cursive, fantasy</b>.</p>
</body>

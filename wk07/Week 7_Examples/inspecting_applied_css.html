<!doctype html>
<meta charset="utf-8">
<title>Inspecting Applied CSS</title>
<style>
  :root { --brand:#0a66c2; --space:1rem; }
  body { font-family: system-ui, sans-serif; line-height:1.55; }
  .card { max-width: 420px; margin: 2rem auto; padding: var(--space); border: 1px solid #ddd; }
  .title { font-size: 1.5rem; margin: 0 0 .5rem; }
  .lead { color:#444; margin-bottom:.5rem; }
  .price { color: var(--brand); font-weight: 700; }
  .btn { background: var(--brand); color:#fff; padding:.6rem 1rem; border-radius:.5rem; display:inline-block; }
  /* Intentional issues */
  .card .btn { background:#999 }      /* overrides brand color */
  .lede { font-weight:600 }           /* class typo; doesn’t match .lead */
  .media { display:flex; gap:1rem }
  .media img { width: 300px; }        /* fixed width – may overflow on small screens */
</style>
<body>
    <article class="card">
    <h2 class="title">Pro Plan</h2>
    <p class="lead">Everything you need for small teams.</p>
    <div class="media">
        <img src="https://via.placeholder.com/400x200" alt="Preview">
        <p class="price">$19 / mo</p>
    </div>
    <a class="btn" href="#">Get started</a>
    </article>
</body>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>@font-face Example</title>

  <style>
    @font-face {
      font-family: 'Roboto';
      src: url(fonts/Roboto-VariableFont_wdth\,wght.ttf) format('truetype');
    }

    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body>
  <h1>This is Roboto Font</h1>
  <p>This font is loaded locally using @font-face.</p>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Fonts: Poppins Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles belong inside HEAD -->
    <style>
      :root { --body: 18px; }
      body {
        margin: 2rem;
        font-size: var(--body);
        line-height: 1.6;
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      h1 { font-weight: 700; margin-bottom: .25em; }
      .caption { font-size: 0.9rem; opacity: .8; }
      .btn { display:inline-block; padding:.6em 1em; border-radius:.5em; font-weight:700; background:#0a66c2; color:#fff; text-decoration:none; }
    </style>
  </head>
  <body>
    <h1>Brand Heading with Poppins 700</h1>
    <p>Body copy using Poppins 400. The quick brown fox jumps over the lazy dog, 0123456789.</p>
    <p class="caption">Subtle caption to check readability at smaller sizes.</p>
    <a class="btn" href="#">Call to Action</a>
  </body>
</html>

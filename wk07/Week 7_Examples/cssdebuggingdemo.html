<!doctype html>
<meta charset="utf-8">
<title>CSS Debugging Demo</title>
<style>
  :root { --brand:#0a66c2; --space:1rem; }
  .card { max-width: 420px; border:1px solid #ddd; padding: var(--space); margin:2rem auto; }
  .title { font-size:1.4rem; margin:0 0 .5rem; }
  .price { color: var(--brand); font-weight:700; }
  .btn { background: var(--brand); color:#fff; padding:.6rem 1rem; border-radius:.5rem; display:inline-block; }
  /* Intentional bugs */
  .Card { padding: 0 }                 /* class name case mismatch */
  .card .btn { background: #999 }      /* specificity fight */
  .badge { background:#ffe08a; padding:.25rem .5rem; border-radius:999px; }
  .badge { padding:.25rem .5rem }      /* harmless repetition */
  .media { display:flex; gap:1rem }
  .media img { width:200px }           /* will overflow on small screens */
</style>
<body>
    <article class="card">
    <h2 class="title">Pro Plan <span class="badge">New</span></h2>
    <div class="media">
        <img src="https://via.placeholder.com/400x200" alt="Preview">
        <p class="price">$19 / mo</p>
    </div>
    <a class="btn" href="#">Get started</a>
    </article>
</body>

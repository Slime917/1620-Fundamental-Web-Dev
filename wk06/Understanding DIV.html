<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding DIV</title>
    <style>
        .card{
            border: 2px solid black;
            padding: 15px;
            margin: 10px;
            background-color: cornsilk;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>List</h2>
        <ul>
            <li>asdfasdf</li>
            <li>asdfasdf</li>
            <li>sdfasdf</li>
        </ul>
    </div>

    <div class="card">
        <h3>CSS</h3>
        <p>sdfasdfasdf</p>
    </div>
</body>
</html>
